<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="326" viewBox="0 0 1000 326" role="img" aria-labelledby="title description">
<title id="title">SQL occurrence order drives the bound tuple.</title><desc id="description">Reorder PostgreSQL placeholders from $2, $1, $1 to $1, $2, $1. The inferred tuple changes from string/bigint/bigint to bigint/string/bigint; factory arguments remain in numeric order.</desc>
<style>
svg{--bg:#0b1b22;--bar:#10242d;--line:#29404b;--ink:#d9e7ed;--muted:#8099a6;--accent:#60d4e1;--purple:#c69bed;--blue:#8ec7fa;--green:#b4ce94;--gold:#e3bc78;--error:#ff8796;--tint:#173940;--ok:#8fd6b0;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
@media(prefers-color-scheme:light){svg{--bg:#f9fbfd;--bar:#edf3f7;--line:#cfdee7;--ink:#213848;--muted:#61798a;--accent:#007887;--purple:#7f3e9c;--blue:#155d9d;--green:#426527;--gold:#885c12;--error:#bc2949;--tint:#e0f1f3;--ok:#19754d}}
text{white-space:pre}.code{fill:var(--ink)}.line-number{fill:var(--muted);font-size:12px;text-anchor:end}.label{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:var(--muted)}.heading{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:600;fill:var(--ink)}.sql{fill:var(--accent)}.keyword{fill:var(--purple)}.string{fill:var(--green)}.value{fill:var(--gold)}.type{fill:var(--blue)}.scene{opacity:0}.scene-0{opacity:1}.hidden{display:none}.reveal{transform-box:fill-box;transform-origin:left center}.typing-caret{animation-timing-function:steps(1)}.progress{transform-origin:0 0;animation:progress 8.8s linear infinite}@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes scene-0{0%{opacity:1}49.9886%{opacity:1}50.0000%{opacity:0}100%{opacity:0}} .scene-0{animation:scene-0 8.8s steps(1) infinite}
@keyframes hover-0{0%{opacity:0}22.7159%{opacity:0}22.7273%{opacity:1}48.2841%{opacity:1}48.2955%{opacity:0}100%{opacity:0}} .hover-0{animation:hover-0 8.8s steps(1) infinite}
@keyframes pointer-0{0%,13.6364%{transform:translate(520px,266px)}22.1591%,100%{transform:translate(175px,133px)}}.pointer-0{animation:pointer-0 8.8s cubic-bezier(.2,.7,.3,1) infinite}
@keyframes scene-1{0%{opacity:0}49.9886%{opacity:0}50.0000%{opacity:1}99.9886%{opacity:1}100.0000%{opacity:0}100%{opacity:0}} .scene-1{animation:scene-1 8.8s steps(1) infinite}
@keyframes resolved-1{0%{opacity:0}63.0568%{opacity:0}63.0682%{opacity:1}99.9886%{opacity:1}100.0000%{opacity:0}100%{opacity:0}} .resolved-1{animation:resolved-1 8.8s steps(1) infinite}
@keyframes checking-1{0%{opacity:0}49.9886%{opacity:0}50.0000%{opacity:1}63.0568%{opacity:1}63.0682%{opacity:0}100%{opacity:0}} .checking-1{animation:checking-1 8.8s steps(1) infinite}
@keyframes reveal-1{0%,51.7045%{transform:scaleX(0)}61.3636%,100%{transform:scaleX(1)}}.reveal-1{animation:reveal-1 8.8s steps(7,end) infinite}
@keyframes suffix-1{0%,51.7045%{transform:translateX(-54.6px)}61.3636%,100%{transform:translateX(0)}}.suffix-1{animation:suffix-1 8.8s steps(7,end) infinite}
@keyframes caret-1{0%,51.7045%{transform:translateX(0)}61.3636%,100%{transform:translateX(54.6px)}}.caret-1{animation:caret-1 8.8s steps(7,end) infinite}
@keyframes hover-1{0%{opacity:0}72.7159%{opacity:0}72.7273%{opacity:1}98.2841%{opacity:1}98.2955%{opacity:0}100%{opacity:0}} .hover-1{animation:hover-1 8.8s steps(1) infinite}
@keyframes pointer-1{0%,63.6364%{transform:translate(520px,266px)}72.1591%,100%{transform:translate(143.8px,133px)}}.pointer-1{animation:pointer-1 8.8s cubic-bezier(.2,.7,.3,1) infinite}
@media(prefers-reduced-motion:reduce){.scene{animation:none!important;opacity:0}.scene.final{opacity:1}.motion,.progress,.resolved{animation:none!important;transform:none!important}.typing-caret,.pointer,.hover,.checking{display:none!important}.resolved{opacity:1!important}}
</style>
<rect x=".5" y=".5" width="999" height="325" rx="12" fill="var(--bg)" stroke="var(--line)"/>
<path d="M12 1H988Q999 1 999 12V42H1V12Q1 1 12 1" fill="var(--bar)"/>
<text x="20" y="26" class="heading">PostgreSQL</text><text x="120" y="26" class="label">/ SQL occurrence order drives the bound tuple.</text>
<path d="M590 42V293M1 76H999M1 293H999" stroke="var(--line)" fill="none"/>
<text x="610" y="64" class="heading">Inferred types</text>
<g class="scene scene-0">
<text x="18" y="64" class="heading">account.sql</text><path d="M10 75h160" stroke="var(--accent)" stroke-width="2"/>

<rect x="38" y="112" width="540" height="23" rx="3" fill="var(--tint)"/>
<text x="22" y="106" class="line-number">1</text><text x="46" y="106" class="code" font-size="13"><tspan class="sql">SELECT</tspan> id, email <tspan class="sql">FROM</tspan> users</text>
<text x="22" y="129" class="line-number">2</text><text x="46" y="129" class="code" font-size="13"><tspan class="sql">WHERE</tspan> email &lt;&gt; <tspan class="value">$2</tspan></text>
<text x="22" y="152" class="line-number">3</text><text x="46" y="152" class="code" font-size="13">  <tspan class="sql">AND</tspan> (id = <tspan class="value">$1</tspan> <tspan class="sql">OR</tspan> id = <tspan class="value">$1</tspan>);</text>
<g class=" resolved"><text x="610" y="103" class="label">Result row</text><text x="610" y="128" class="code" font-size="14">{ <tspan class="string">&quot;id&quot;</tspan>: <tspan class="type">bigint</tspan>; <tspan class="string">&quot;email&quot;</tspan>: <tspan class="type">string</tspan>; }</text>
<text x="610" y="173" class="label">Bound parameters</text><text x="610" y="198" class="code" font-size="13"><tspan class="keyword">readonly</tspan> [<tspan class="type">string</tspan>, <tspan class="type">bigint</tspan>, <tspan class="type">bigint</tspan>]</text>
<circle cx="18" cy="310" r="3" fill="var(--ok)"/>
<text x="30" y="314" class="label">Factory: account(42n, &quot;excluded@example.com&quot;)</text></g>
<g class="hidden checking"><text x="610" y="103" class="label">Checking the edit…</text><text x="18" y="314" class="label">Analyzing…</text></g>
<g class="pointer-0 pointer motion"><path d="M0 0L2 20L7 15L12 24L16 22L11 13L18 12Z" fill="var(--ink)" stroke="var(--bg)" stroke-width="1.5"/></g>
<g class="hover-0 hover"><path d="M163 133h15.6" stroke="var(--accent)"/>
<rect x="54" y="149" width="510" height="75" rx="7" fill="var(--bar)" stroke="var(--line)"/>
<text x="68" y="171" class="label">Bound parameter tuple</text>
<text x="68" y="195" class="code" font-size="13"><tspan class="keyword">readonly</tspan> [<tspan class="type">string</tspan>, <tspan class="type">bigint</tspan>, <tspan class="type">bigint</tspan>]</text></g>
</g>
<g class="scene scene-1 final">
<text x="18" y="64" class="heading">account.sql</text><path d="M10 75h160" stroke="var(--accent)" stroke-width="2"/>

<rect x="38" y="112" width="540" height="23" rx="3" fill="var(--tint)"/>
<text x="22" y="106" class="line-number">1</text><text x="46" y="106" class="code" font-size="13"><tspan class="sql">SELECT</tspan> id, email <tspan class="sql">FROM</tspan> users</text>
<text x="22" y="129" class="line-number">2</text><text x="46" y="129" class="code" font-size="13"><tspan class="sql">WHERE</tspan> </text>
<defs><clipPath id="typing-1"><rect width="55.6" height="23" class="reveal-1 reveal motion"/></clipPath></defs>
<g transform="translate(92.8 112)"><g clip-path="url(#typing-1)"><text x="0" y="17" class="code" font-size="13">id = <tspan class="value">$1</tspan></text></g><rect x="0" y="1" width="1.5" height="20" fill="var(--accent)" class="caret-1 typing-caret motion"/></g>
<g class="suffix-1 typing-suffix motion"><text x="147.4" y="129" class="code" font-size="13"></text></g>
<text x="22" y="152" class="line-number">3</text><text x="46" y="152" class="code" font-size="13">  <tspan class="sql">AND</tspan> (email &lt;&gt; <tspan class="value">$2</tspan> <tspan class="sql">OR</tspan> id = <tspan class="value">$1</tspan>);</text>
<g class="resolved-1 resolved"><text x="610" y="103" class="label">Result row</text><text x="610" y="128" class="code" font-size="14">{ <tspan class="string">&quot;id&quot;</tspan>: <tspan class="type">bigint</tspan>; <tspan class="string">&quot;email&quot;</tspan>: <tspan class="type">string</tspan>; }</text>
<text x="610" y="173" class="label">Bound parameters</text><text x="610" y="198" class="code" font-size="13"><tspan class="keyword">readonly</tspan> [<tspan class="type">bigint</tspan>, <tspan class="type">string</tspan>, <tspan class="type">bigint</tspan>]</text>
<circle cx="18" cy="310" r="3" fill="var(--ok)"/>
<text x="30" y="314" class="label">Same arguments · bound tuple follows SQL order</text></g>
<g class="checking-1 checking"><text x="610" y="103" class="label">Checking the edit…</text><text x="18" y="314" class="label">Analyzing…</text></g>
<g class="pointer-1 pointer motion"><path d="M0 0L2 20L7 15L12 24L16 22L11 13L18 12Z" fill="var(--ink)" stroke="var(--bg)" stroke-width="1.5"/></g>
<g class="hover-1 hover"><path d="M131.8 133h15.6" stroke="var(--accent)"/>
<rect x="54" y="149" width="510" height="75" rx="7" fill="var(--bar)" stroke="var(--line)"/>
<text x="68" y="171" class="label">Bound parameter tuple</text>
<text x="68" y="195" class="code" font-size="13"><tspan class="keyword">readonly</tspan> [<tspan class="type">bigint</tspan>, <tspan class="type">string</tspan>, <tspan class="type">bigint</tspan>]</text></g>
</g>
<rect x="1" y="324" width="998" height="1.5" fill="var(--accent)" class="progress"/>
</svg>
