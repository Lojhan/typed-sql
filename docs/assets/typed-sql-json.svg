<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
<title id="title">Nested JSON keeps the shape your SQL builds.</title><desc id="description">Rename the customer key to buyer in a PostgreSQL JSON constructor. The inferred nested object updates and preserves the items array. The editor displays the SELECT expression; joins and grouping are present in the checked query.</desc>
