<text x="22" y="106" class="line-number">1</text><text x="46" y="106" class="code" font-size="13"><tspan class="keyword">export</tspan> <tspan class="keyword">function</tspan> insertProducts(items: <tspan class="keyword">readonly</tspan> <tspan class="type">NewProduct</tspan>[]) {</text>
<text x="22" y="129" class="line-number">2</text><text x="46" y="129" class="code" font-size="13">  <tspan class="keyword">if</tspan> (!items.length) <tspan class="keyword">throw</tspan> <tspan class="keyword">new</tspan> <tspan class="type">RangeError</tspan>(<tspan class="string">&quot;Empty collection&quot;</tspan>);</text>
<text x="22" y="152" class="line-number">3</text><text x="46" y="152" class="code" font-size="13">  <tspan class="keyword">return</tspan> sql`</text>
<text x="22" y="175" class="line-number">4</text><text x="46" y="175" class="code" font-size="13">    <tspan class="sql">INSERT</tspan> <tspan class="sql">INTO</tspan> products</text>
<text x="22" y="198" class="line-number">5</text><text x="46" y="198" class="code" font-size="13">      (id, sku, title, price_cents, active)</text>
<text x="22" y="221" class="line-number">6</text><text x="46" y="221" class="code" font-size="13">    <tspan class="sql">VALUES</tspan> ${items.map(item =&gt; sql.fragment`</text>
<text x="22" y="244" class="line-number">7</text><text x="46" y="244" class="code" font-size="13">      (${item.id}, ${item.sku}, ${item.title},</text>
<text x="22" y="267" class="line-number">8</text><text x="46" y="267" class="code" font-size="13">       ${item.priceCents}, ${true})</text>
<text x="22" y="290" class="line-number">9</text><text x="46" y="290" class="code" font-size="13">    `)}</text>
<text x="22" y="313" class="line-number">10</text><text x="46" y="313" class="code" font-size="13">    <tspan class="sql">RETURNING</tspan> id, sku</text>
<text x="22" y="336" class="line-number">11</text><text x="46" y="336" class="code" font-size="13">  `;</text>
<text x="22" y="359" class="line-number">12</text><text x="46" y="359" class="code" font-size="13">}</text>
