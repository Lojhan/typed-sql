<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="463" viewBox="0 0 1000 463" role="img" aria-labelledby="title description">
<title id="title">Map a collection. Infer the RETURNING row.</title><desc id="description">A mapped fragment collection becomes one parameterized INSERT. Adding title to RETURNING adds a string field to the inferred row. Runtime-sized collections use a readonly parameter array.</desc>
<style>
