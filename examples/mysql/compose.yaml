name: typed-sql-example-mysql

services:
  mysql:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/typed-sql-example-mysql:8.4.11
    environment:
      MYSQL_DATABASE: typed_sql_examples
      MYSQL_PASSWORD: typed_sql_examples
      MYSQL_ROOT_PASSWORD: typed_sql_root
      MYSQL_USER: typed_sql
    ports:
      - "127.0.0.1:53311:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=typed_sql", "--password=typed_sql_examples"]
      interval: 1s
      timeout: 3s
      retries: 60
    tmpfs:
      - /var/lib/mysql
