name: Upstream language references

on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-language-references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-reference-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:language:refresh
      - run: pnpm audit:language:check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-audit-upstream-reference
          path: test/fixtures/language-audit
