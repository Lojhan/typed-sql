name: Dev workspace integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-workspace-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  workspace-postgres:
    name: dev workspace (Node ${{ matrix.node }}, PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.13, 24.11.1]
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: typed_sql_fixture
          POSTGRES_DB: typed_sql_workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d typed_sql_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TYPED_SQL_PLAYGROUND_PG_URL: postgresql://postgres:typed_sql_fixture@127.0.0.1:5432/typed_sql_workspace_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build host, CLI and browser assets
        run: |
          pnpm exec tsc -b packages/playground packages/cli
          pnpm --filter @typed-sql/playground typecheck:ui
          pnpm --filter @typed-sql/playground build:ui
      - name: Verify project files, protected host, TS/SQL runs and PostgreSQL adapter
        run: pnpm --filter @typed-sql/playground test
