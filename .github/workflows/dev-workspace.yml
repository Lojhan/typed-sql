name: Dev workspace integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-workspace-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  workspace-postgres:
    name: dev workspace (Node ${{ matrix.node }}, PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.13, 24.11.1]
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: typed_sql_fixture
          POSTGRES_DB: typed_sql_workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d typed_sql_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TYPED_SQL_PLAYGROUND_PG_URL: postgresql://postgres:typed_sql_fixture@127.0.0.1:5432/typed_sql_workspace_test
      TYPED_SQL_EXPLORER_ADMIN_URL: postgresql://postgres:typed_sql_fixture@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build host, CLI and browser assets
        run: |
          pnpm exec tsc -b packages/playground packages/cli packages/language-server
          pnpm --filter @typed-sql/playground typecheck:ui
          pnpm --filter @typed-sql/playground build:ui
      - name: Verify project files, protected host, TS/SQL runs and PostgreSQL adapter
        run: pnpm --filter @typed-sql/playground test
      - name: Install pinned Chromium for visual behavior regression checks
        if: matrix.node == '24.11.1'
        run: pnpm dlx playwright@1.64.1 install --with-deps chromium
      - name: Verify packed workspace in a real browser
        if: matrix.node == '24.11.1'
        env:
          TYPED_SQL_BROWSER_INSTALLED: '1'
        run: |
          pnpm exec tsc -b packages/sqlite
          node --import tsx e2e/playground-ui/test.mjs
          node --import tsx e2e/playground-ui/editor-test.mjs
          node --import tsx e2e/playground-ui/explorer-test.mjs
          node --import tsx e2e/playground-ui/agent-test.mjs
      - name: Retain browser evidence and component screenshots
        if: always() && matrix.node == '24.11.1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-ui-browser
          path: artifacts/playground-ui/
          if-no-files-found: error
