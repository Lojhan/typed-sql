name: Editor marketplaces

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish the experimental VSIX to
        required: true
        default: both
        type: choice
        options: [both, visual-studio-marketplace, open-vsx]
      evidence_run_id:
        description: Successful comprehensive CI workflow_dispatch run for this exact main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: editor-marketplaces
  cancel-in-progress: false

jobs:
  artifact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require exact comprehensive CI evidence
        run: node scripts/editor-marketplace.mjs evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPED_SQL_EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm build
      - run: pnpm --filter ./editors/vscode package:vsix
      - run: node scripts/editor-marketplace.mjs record
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typed-sql-marketplace-vsix
          path: |
            artifacts/typed-sql-vscode.vsix
            artifacts/editor-marketplace.json
          if-no-files-found: error
          retention-days: 90

  visual-studio-marketplace:
    needs: artifact
    if: inputs.registry == 'both' || inputs.registry == 'visual-studio-marketplace'
    runs-on: ubuntu-latest
    environment: visual-studio-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: typed-sql-marketplace-vsix
          path: artifacts
      - run: node scripts/editor-marketplace.mjs verify
      - run: pnpm --filter ./editors/vscode exec vsce publish --oidc --pre-release --skip-duplicate --packagePath ../../artifacts/typed-sql-vscode.vsix

  open-vsx:
    needs: artifact
    if: inputs.registry == 'both' || inputs.registry == 'open-vsx'
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: typed-sql-marketplace-vsix
          path: artifacts
      - run: node scripts/editor-marketplace.mjs verify
      - run: pnpm exec ovsx publish artifacts/typed-sql-vscode.vsix --trusted-publishing --skip-duplicate
