name: Language audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-audit-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  embedded:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: duckdb
            version: 1.5.6
          - dialect: duckdb
            version: 2.0.0
          - dialect: sqlite
            version: node-24.22.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture and review the complete embedded engine inventory
        env:
          AUDIT_DIALECT: ${{ matrix.dialect }}
          AUDIT_VERSION: ${{ matrix.version }}
        run: |
          if [ "$AUDIT_DIALECT" = duckdb ]; then
            pnpm audit:language live --dialect "$AUDIT_DIALECT" --version "$AUDIT_VERSION" --require-reviewed --output "artifacts/language-audit/$AUDIT_DIALECT-$AUDIT_VERSION.json"
          else
            pnpm audit:language live --dialect "$AUDIT_DIALECT" --require-reviewed --output "artifacts/language-audit/$AUDIT_DIALECT-$AUDIT_VERSION.json"
          fi
      - name: Audit generated native invocation shapes
        env:
          AUDIT_DIALECT: ${{ matrix.dialect }}
          AUDIT_VERSION: ${{ matrix.version }}
        run: pnpm audit:language shapes --dialect "$AUDIT_DIALECT" --version "$AUDIT_VERSION" --output "artifacts/language-audit/$AUDIT_DIALECT-$AUDIT_VERSION.shapes.json"
      - name: Verify generated catalog inputs against the native capture
        env:
          AUDIT_DIALECT: ${{ matrix.dialect }}
          AUDIT_VERSION: ${{ matrix.version }}
        run: pnpm catalog:check-input "artifacts/language-audit/$AUDIT_DIALECT-$AUDIT_VERSION.json"
      - name: Verify generated common types against native preparation
        if: matrix.dialect == 'duckdb'
        env:
          AUDIT_VERSION: ${{ matrix.version }}
        run: node scripts/catalog-generation/duckdb-native.mjs check "$AUDIT_VERSION" "grammar/duckdb/catalog/combinations-$AUDIT_VERSION.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-audit-${{ matrix.dialect }}-${{ matrix.version }}
          path: artifacts/language-audit
          if-no-files-found: error

  upstream-reference-drift:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:language:refresh
      - run: pnpm audit:language:check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-audit-upstream-reference
          path: test/fixtures/language-audit
