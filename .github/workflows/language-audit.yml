name: Language audit

on:
  pull_request:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-audit-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  embedded-targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - id: targets
        run: node scripts/language-audit/embedded-targets.mjs >> "$GITHUB_OUTPUT"

  embedded:
    needs: embedded-targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.embedded-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packed native contract consumers
        if: matrix.dialect == 'duckdb'
        run: pnpm build
      - name: Capture and review the complete embedded engine inventory
        env:
          AUDIT_DIALECT: ${{ matrix.dialect }}
          AUDIT_VERSION: ${{ matrix.version }}
        run: |
          if [ "$AUDIT_DIALECT" = duckdb ]; then
            pnpm audit:language live --dialect "$AUDIT_DIALECT" --version "$AUDIT_VERSION" --require-reviewed --output "artifacts/language-audit/$AUDIT_DIALECT-$AUDIT_VERSION.json"
          else
            pnpm audit:language live --dialect "$AUDIT_DIALECT" --require-reviewed --output "artifacts/language-audit/$AUDIT_DIALECT-$AUDIT_VERSION.json"
          fi
      - name: Verify native contracts, offline builds and packaged editor regeneration
        if: matrix.dialect == 'duckdb'
        env:
          TYPED_SQL_DUCKDB_TARGET: ${{ matrix.version }}
        run: pnpm --filter @typed-sql/e2e-duckdb e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-audit-${{ matrix.dialect }}-${{ matrix.version }}
          path: |
            artifacts/language-audit
            artifacts/duckdb/packed
          if-no-files-found: error

  upstream-reference-drift:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:language:refresh
      - run: pnpm audit:language:check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-audit-upstream-reference
          path: test/fixtures/language-audit
