name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.11
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  postgres-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.11
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:postgres
        env:
          TYPED_SQL_CONTAINER_ENGINE: docker
