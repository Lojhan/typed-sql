name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: npm release channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pending_changesets
        name: Detect pending changesets
        shell: bash
        run: |
          if compgen -G '.changeset/*.md' | grep -qv '^.changeset/README.md$'; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: changesets/action/version@v2
        if: steps.pending_changesets.outputs.present == 'true'
        with:
          script: pnpm version-packages

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm e2e:packed
        env:
          TYPED_SQL_CONTAINER_ENGINE: docker
      - run: pnpm audit --prod --audit-level high
      - name: Assert beta release contract
        if: inputs.channel == 'beta'
        run: pnpm release:assert beta
      - name: Assert stable release contract
        if: inputs.channel == 'stable'
        run: pnpm release:assert stable
      - uses: changesets/action/publish@v2
        if: inputs.channel == 'beta'
        with:
          script: pnpm release:beta
          create-github-releases: true
          push-git-tags: true
      - uses: changesets/action/publish@v2
        if: inputs.channel == 'stable'
        with:
          script: pnpm release:stable
          create-github-releases: true
          push-git-tags: true
