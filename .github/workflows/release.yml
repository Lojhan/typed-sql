name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: npm release channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - rc
          - stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pending_changesets
        name: Detect pending changesets
        run: node scripts/detect-pending-changesets.mjs >> "$GITHUB_OUTPUT"
      - uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2
        if: steps.pending_changesets.outputs.present == 'true'
        with:
          script: pnpm version-packages

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm e2e:packed
        env:
          TYPED_SQL_CONTAINER_ENGINE: docker
      - name: Verify registry-only release candidate
        if: inputs.channel == 'stable'
        run: pnpm e2e:registry
        env:
          TYPED_SQL_CONTAINER_ENGINE: docker
          TYPED_SQL_REGISTRY_TAG: next
          TYPED_SQL_REGISTRY_PREVIEW_TAG: next
      - run: pnpm audit --prod --audit-level high
      - name: Assert CodeQL release policy
        run: pnpm release:security
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert beta release contract
        if: inputs.channel == 'beta'
        run: pnpm release:assert beta
      - name: Assert release-candidate contract
        if: inputs.channel == 'rc'
        run: pnpm release:assert rc
      - name: Assert stable release contract
        if: inputs.channel == 'stable'
        run: pnpm release:assert stable
      - name: Publish beta
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2
        if: inputs.channel == 'beta'
        with:
          script: pnpm release:beta
          create-github-releases: true
          push-git-tags: true
      - name: Publish release candidate
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2
        if: inputs.channel == 'rc'
        with:
          script: pnpm release:rc
          create-github-releases: true
          push-git-tags: true
      - name: Verify published prerelease from npm
        if: inputs.channel == 'beta' || inputs.channel == 'rc'
        run: pnpm e2e:registry
        env:
          TYPED_SQL_CONTAINER_ENGINE: docker
          TYPED_SQL_REGISTRY_EXPECTED: workspace
          TYPED_SQL_REGISTRY_TAG: next
          TYPED_SQL_REGISTRY_PREVIEW_TAG: next
      - name: Publish stable
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2
        if: inputs.channel == 'stable'
        with:
          script: pnpm release:stable
          create-github-releases: true
          push-git-tags: true
      - name: Verify published stable packages from npm
        if: inputs.channel == 'stable'
        run: pnpm e2e:registry
        env:
          TYPED_SQL_CONTAINER_ENGINE: docker
          TYPED_SQL_REGISTRY_EXPECTED: workspace
          TYPED_SQL_REGISTRY_TAG: latest
          TYPED_SQL_REGISTRY_PREVIEW_TAG: next
      - name: Publish aggregate stable release notes
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_series="$(node -p "require('./release-manifest.json').series")"
          release_tag="v${release_series}"
          notes_file=".github/release-notes/${release_series}.md"
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "${release_tag} already exists; preserving the published release."
          else
            gh release create "${release_tag}" --target "${GITHUB_SHA}" --title "typed-sql ${release_series}" --notes-file "${notes_file}"
          fi
