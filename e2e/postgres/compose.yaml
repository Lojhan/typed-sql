name: typed-sql-e2e

services:
  postgres:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/typed-sql-e2e-postgres:18.4
    environment:
      POSTGRES_DB: typed_sql_e2e
      POSTGRES_PASSWORD: typed_sql_e2e
      POSTGRES_USER: typed_sql
    ports:
      - "127.0.0.1:${TYPED_SQL_E2E_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username typed_sql --dbname typed_sql_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
